<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Privacy-aware SQL reporting workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071A1F"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2DD4BF"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Privacy-aware analytics workflow</text>
  <text x="70" y="88" fill="#94A3B8" font-family="Segoe UI,Arial" font-size="17">From synthetic source tables to safe, reusable cohort insight</text>
  <path id="track" d="M120 190 H1280" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 190 H1280" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="160 1000">
    <animate attributeName="stroke-dashoffset" values="1160;0" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="10" fill="#FBBF24">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <g font-family="Segoe UI,Arial" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(120 132)"><rect x="-90" width="180" height="118" rx="22" fill="#0B2A32" stroke="#2DD4BF"/><text y="40" fill="#5EEAD4" font-size="25">①</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Source</text><text y="98" fill="#94A3B8" font-size="13">Relational tables</text></g>
    <g transform="translate(352 132)"><rect x="-90" width="180" height="118" rx="22" fill="#0B2637" stroke="#22D3EE"/><text y="40" fill="#67E8F9" font-size="25">②</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Pseudonymise</text><text y="98" fill="#94A3B8" font-size="13">Synthetic keys only</text></g>
    <g transform="translate(584 132)"><rect x="-90" width="180" height="118" rx="22" fill="#10233A" stroke="#38BDF8"/><text y="40" fill="#7DD3FC" font-size="25">③</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Validate</text><text y="98" fill="#94A3B8" font-size="13">Quality checks</text></g>
    <g transform="translate(816 132)"><rect x="-90" width="180" height="118" rx="22" fill="#17203C" stroke="#818CF8"/><text y="40" fill="#A5B4FC" font-size="25">④</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Model</text><text y="98" fill="#94A3B8" font-size="13">Reusable KPI view</text></g>
    <g transform="translate(1048 132)"><rect x="-90" width="180" height="118" rx="22" fill="#211F43" stroke="#A78BFA"/><text y="40" fill="#C4B5FD" font-size="25">⑤</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Compare</text><text y="98" fill="#94A3B8" font-size="13">Cohort analysis</text></g>
    <g transform="translate(1280 132)"><rect x="-90" width="180" height="118" rx="22" fill="#2A2335" stroke="#FBBF24"/><text y="40" fill="#FDE68A" font-size="25">⑥</text><text y="72" fill="#F8FAFC" font-size="18" font-weight="700">Report safely</text><text y="98" fill="#94A3B8" font-size="13">Suppress small cells</text></g>
  </g>
</svg>
