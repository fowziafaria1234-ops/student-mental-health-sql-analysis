<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-label="Student Mental Health SQL Analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A1F"/>
      <stop offset="0.52" stop-color="#0F2940"/>
      <stop offset="1" stop-color="#18233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1400" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="100" r="170" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="150;190;150" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.18" stroke="#38BDF8" fill="none">
    <path d="M0 295 C210 235 310 335 520 255 S860 165 1045 245 S1240 310 1400 205" stroke-width="3">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 295 C210 235 310 335 520 255 S860 165 1045 245 S1240 310 1400 205;M0 270 C210 330 310 215 520 300 S860 290 1045 195 S1240 155 1400 260;M0 295 C210 235 310 335 520 255 S860 165 1045 245 S1240 310 1400 205"/>
    </path>
  </g>
  <g transform="translate(72 72)">
    <rect x="0" y="0" width="108" height="32" rx="16" fill="#0F766E" opacity="0.95"/>
    <text x="54" y="22" text-anchor="middle" fill="#ECFEFF" font-family="Segoe UI,Arial" font-size="14" font-weight="700">SQL PORTFOLIO</text>
    <text x="0" y="100" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="56" font-weight="750">Student Mental Health</text>
    <text x="0" y="160" fill="url(#accent)" font-family="Segoe UI,Arial" font-size="56" font-weight="750">SQL Analysis</text>
    <text x="2" y="211" fill="#CBD5E1" font-family="Segoe UI,Arial" font-size="24">Privacy-aware cohort reporting · reusable KPI logic · SQLite</text>
    <g transform="translate(0 244)">
      <rect width="610" height="7" rx="4" fill="#1E293B"/>
      <rect width="205" height="7" rx="4" fill="url(#accent)">
        <animate attributeName="width" values="130;610;130" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <g transform="translate(1010 64)" filter="url(#shadow)">
    <rect width="310" height="250" rx="30" fill="#0B2230" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="28" y="42" fill="#94A3B8" font-family="Segoe UI,Arial" font-size="15" letter-spacing="2">PRIVACY-FIRST MODEL</text>
    <g transform="translate(26 68)">
      <path d="M130 0 L220 32 V98 C220 151 183 191 130 215 C77 191 40 151 40 98 V32 Z" fill="#0F766E" opacity="0.36" stroke="#5EEAD4" stroke-width="3"/>
      <path d="M92 104 L121 132 L173 77" fill="none" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 160;160 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="130" cy="106" r="82" fill="none" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="2">
        <animate attributeName="r" values="72;96;72" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;.08;.6" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
